[package]
name = "map-jigsaw-puzzle"
version = "0.1.15"
description = "MAP Sliding Puzzle kiosk"
authors = ["ViitorCloud"]
edition = "2021"
rust-version = "1.77.2"

[lib]
# The Tauri v2 layout: main.rs is a thin shim over lib.rs so the app can also be
# driven from tests or a future mobile entry point.
name = "map_jigsaw_puzzle_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
dotenvy = "0.15"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

# Collection API proxy. rustls rather than native-tls so there is no OpenSSL
# build dependency on Windows.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "gzip",
] }
dotenvy = "0.15"
thiserror = "2"
# Only the async Mutex, for the OAuth token cache. Tauri already runs a tokio
# runtime; this adds the sync primitives, not a second runtime.
tokio = { version = "1", default-features = false, features = ["sync"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
