<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Kiosk: fixed viewport, no user scaling. The whole UI is scaled by one
         CSS transform (see src/canvas/ScaledCanvas.tsx), never by the browser. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <!-- The kiosk has no browser chrome, so no favicon is needed. An empty data
         URI stops the webview requesting /favicon.ico and logging a 404. -->
    <link rel="icon" href="data:," />
    <title>MAP Jigsaw Puzzle</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
